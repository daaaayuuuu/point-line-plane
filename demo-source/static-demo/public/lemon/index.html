<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柠檬番茄闹钟</title><style>
:root{--bg:#11130b;--panel:#1c2114;--lemon:#f6e84a;--leaf:#9adf62;--ink:#f7f8e9;--muted:#b8c19c;--danger:#ff8f70;--line:#69734b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"PingFang SC","Microsoft YaHei",monospace}main{max-width:960px;margin:auto;padding:20px;min-height:100vh}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:2px solid var(--line);padding-bottom:16px}h1{font-size:clamp(1.1rem,4vw,1.6rem);margin:0;color:var(--lemon)}.tag{color:var(--leaf);font-size:.78rem}.grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:20px}.panel{background:var(--panel);border:2px solid var(--line);box-shadow:5px 5px 0 #080a05;padding:18px}h2{font-size:1rem;margin:0 0 14px;color:var(--lemon)}label{display:block;margin:12px 0 5px}input{width:100%;min-height:44px;background:#0d1008;color:var(--ink);border:2px solid var(--line);padding:8px;font:inherit}input:focus-visible,button:focus-visible{outline:3px solid var(--lemon);outline-offset:3px}button{min-height:44px;cursor:pointer;padding:8px 12px;border:2px solid var(--ink);background:var(--lemon);color:#15170d;font:inherit;font-weight:800;box-shadow:3px 3px 0 #080a05}button:hover{filter:brightness(1.07)}button.secondary{background:var(--panel);color:var(--ink)}button.danger{background:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.timer{text-align:center}.phase{color:var(--leaf);font-weight:800}.clock{font-size:clamp(3rem,15vw,7rem);letter-spacing:-.1em;margin:18px 0}.bar{height:14px;border:2px solid var(--ink);background:#0d1008}.bar i{display:block;height:100%;background:var(--leaf);width:0;transition:width .2s}.notice{margin-top:14px;padding:10px;border-left:4px solid var(--lemon);background:#262b19}.error{color:var(--danger);min-height:1.4em}.success{border-color:var(--leaf)}dialog{background:var(--panel);color:var(--ink);border:2px solid var(--lemon);max-width:420px}dialog::backdrop{background:#000b}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}@media(min-width:720px){.grid{grid-template-columns:320px 1fr}.records{grid-column:1/-1}}
[data-theme="fresh"]{--bg:#f6f8ee;--panel:#fffef6;--lemon:#53751d;--leaf:#517724;--ink:#263619;--muted:#677559;--danger:#c84827;--line:#c6d3a9}[data-theme="fresh"] input,[data-theme="fresh"] .bar{background:#fff}[data-theme="fresh"] .notice{background:#eef3dd}[data-theme="fresh"] button{background:#f6e84a}[data-theme="fresh"] .secondary{background:var(--panel)}@media(max-width:480px){.top{flex-wrap:wrap}.top .tag{margin-top:8px}main{padding:14px}dialog{width:90vw}}
</style></head><body><main><header class="top"><div><h1>◼ 柠檬番茄闹钟</h1><div class="tag">交互 Demo · 记录仅保存在当前浏览器</div></div><button id="notify" class="secondary">开启提醒</button></header><div class="grid"><section class="panel" aria-labelledby="setup-title"><h2 id="setup-title">01 / 时长设置</h2><label for="focus">专注（分钟）</label><input id="focus" type="number" min="1" max="180" inputmode="numeric" value="25"><label for="break">休息（分钟）</label><input id="break" type="number" min="1" max="180" inputmode="numeric" value="5"><p id="error" class="error" role="alert"></p><button id="start-focus">开始专注 →</button></section><section class="panel timer" aria-live="polite"><h2>02 / 当前阶段</h2><div id="phase" class="phase">等待开始</div><div id="clock" class="clock">25:00</div><div class="bar" aria-label="计时进度"><i id="progress"></i></div><p id="status" class="notice">设置时长后即可开始一轮专注。</p><div class="actions" id="controls"><button id="pause" class="secondary" disabled>暂停</button><button id="end" class="danger" disabled>提前结束</button><button id="next" hidden>开始下一阶段 →</button></div></section><section class="panel records" aria-labelledby="record-title"><h2 id="record-title">03 / 当日记录</h2><p>今天已完整完成 <strong id="count">0</strong> 次专注。</p><p class="tag">只统计自然完成的专注阶段；提前结束不计入。</p><p class="tag">记录归当前浏览器保存；其他人使用不会影响你的计时。清除浏览器数据或更换设备后不会自动找回原记录。</p></section></div><div class="actions"><button id="demo-finish" class="secondary">演示到时</button><span class="tag">先开始计时，再点击即可快速体验阶段结束。</span></div></main><dialog id="confirm"><h2>确认提前结束？</h2><p>本轮不会计入今日专注次数。</p><div class="actions"><button id="confirm-end" class="danger">确认结束</button><button id="cancel-end" class="secondary">继续计时</button></div></dialog><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"obscura-pixel";</script><script src="./browser-storage.js"></script><script>
const $=id=>document.getElementById(id);let state=null,tick=null,settingsDirty=false,sessionReady=false,refreshing=false;const api=browserApi;
function fmt(n){n=Math.max(0,n);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
let reminderAudio=null,reminderEnabled=false;const remindedSessions=new Set();
function announceCompletion(session){if(!session.session_id||remindedSessions.has(session.session_id))return;remindedSessions.add(session.session_id);const message=session.phase==='focus'?'专注完成，休息一下吧。':'休息完成，准备好再开始下一轮。';if(reminderEnabled){if('Notification'in window&&Notification.permission==='granted'){try{new Notification('柠檬番茄闹钟',{body:message,tag:session.session_id})}catch{}}if(navigator.vibrate)navigator.vibrate([150,80,150]);if(reminderAudio&&reminderAudio.state==='running'){try{const oscillator=reminderAudio.createOscillator(),gain=reminderAudio.createGain();oscillator.connect(gain);gain.connect(reminderAudio.destination);gain.gain.setValueAtTime(0.08,reminderAudio.currentTime);oscillator.frequency.value=660;oscillator.start();gain.gain.exponentialRampToValueAtTime(0.001,reminderAudio.currentTime+0.4);oscillator.stop(reminderAudio.currentTime+0.4)}catch{}}}}
function render(s){state=s;if(!settingsDirty){$('focus').value=s.settings.focus_minutes;$('break').value=s.settings.break_minutes}$('count').textContent=s.completed_focus_count;const x=s.session;let running=x.status==='running',paused=x.status==='paused',done=x.status==='completed',ended=x.status==='ended';$('clock').textContent=x.status==='idle'?fmt(s.settings.focus_minutes*60):fmt(x.remaining_seconds);$('phase').textContent=ended?'已提前结束':x.phase==='focus'?'专注中':x.phase==='break'?'休息中':'等待开始';let pct=x.initial_seconds?100-(x.remaining_seconds/x.initial_seconds*100):0;$('progress').style.width=pct+'%';$('pause').disabled=!(running||paused);$('end').disabled=!(running||paused);$('pause').hidden=!(running||paused);$('end').hidden=!(running||paused);$('next').hidden=!done;$('pause').textContent=paused?'继续':'暂停';$('start-focus').disabled=running||paused||done;$('status').className='notice'+(done?' success':'');if(done){announceCompletion(x);let next=x.phase==='focus'?'开始休息':'开始下一轮专注';$('status').textContent=x.phase==='focus'?'专注完成！今日次数已更新，请决定何时休息。':'休息完成！准备好后可开始下一轮专注。';$('next').textContent=next+' →';$('next').onclick=()=>start(x.phase==='focus'?'break':'focus')}else if(ended){$('status').textContent='本轮已提前结束，未计入今日记录。'}else if(paused){$('status').textContent='计时已暂停，剩余时间不会减少。';bindControls()}else if(running){$('status').textContent='以目标结束时间校正；切回页面会自动恢复。';bindControls()}else{$('status').textContent='设置时长后即可开始一轮专注。'}if(s.persistence_warning)$('error').textContent=s.persistence_warning}
function settings(phase){let f=Number($('focus').value),b=Number($('break').value);if(!Number.isInteger(f)||!Number.isInteger(b)||f<1||f>180||b<1||b>180){$('error').textContent='请填写 1–180 的整数分钟。';return null}$('error').textContent='';return {focus_minutes:f,break_minutes:b,phase}}
async function start(phase){if(!sessionReady)return;let body=settings(phase);if(!body)return;try{let next=await api('timer/start',{method:'POST',body:JSON.stringify(body)});settingsDirty=false;render(next)}catch(e){$('error').textContent=e.message}}
function bindControls(){$('pause').onclick=async()=>{try{render(await api('timer/'+(state.session.status==='paused'?'resume':'pause'),{method:'POST'}))}catch(e){$('error').textContent=e.message}};$('end').onclick=()=>$('confirm').showModal()}
['focus','break'].forEach(id=>$(id).addEventListener('input',()=>{settingsDirty=true}));$('start-focus').onclick=()=>start('focus');$('confirm-end').onclick=async()=>{$('confirm').close();try{render(await api('timer/end',{method:'POST',body:'{"confirmed":true}'}))}catch(e){$('error').textContent=e.message}};$('cancel-end').onclick=()=>$('confirm').close();$('notify').onclick=async()=>{reminderEnabled=true;try{const AudioEngine=window.AudioContext||window.webkitAudioContext;if(AudioEngine){reminderAudio=reminderAudio||new AudioEngine();await reminderAudio.resume()}if('Notification'in window){let permission=await Notification.requestPermission();$('notify').textContent=permission==='granted'?'提醒已开启':'声音和应用内提醒'}else $('notify').textContent='声音和应用内提醒'}catch{$('notify').textContent='仅应用内提醒'}};
async function refresh(){if(!sessionReady||refreshing)return;refreshing=true;try{render(await api('timer'))}catch(e){$('error').textContent=e.message}finally{refreshing=false}}async function connect(){try{await api('session',{method:'POST'});sessionReady=true;await refresh()}catch(e){$('error').textContent=e.message;$('start-focus').disabled=true}}document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(refresh,1000);connect();
</script><script>document.getElementById("demo-finish").onclick=async()=>{try{render(await browserApi("timer/demo-finish"))}catch(e){document.getElementById("error").textContent=e.message}};</script></body></html>
